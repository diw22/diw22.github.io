<body>
  <header class="site-header">
    <a class="wordmark" href="#home" aria-label="Dylan Winters home">
      <span>Dylan</span><span>Winters</span>
    </a>
    <nav class="top-links" aria-label="Contact links">
      <a href="assets/docs/DylanWinters_CV.pdf" target="_blank" rel="noopener noreferrer">CV</a>
      <a href="mailto:dylaniwinters@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/dylan-winters-a943401bb/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </header>

  <main id="home">
    <section class="intro home-hero" aria-labelledby="intro-title">
      <video class="home-hero-video" autoplay muted loop playsinline>
        <source src="assets/video/backvid5.mp4" type="video/mp4">
      </video>
      <div class="home-hero-shade"></div>
      <div class="home-hero-copy">
        <p class="kicker">Robotics / Intelligent Systems / Quant</p>
        <h1 id="intro-title">Dylan Winters</h1>
        <p class="intro-note">
          A project-first portfolio. Open the Projects selector to move through selected robotics,
          hardware, data, and trading systems.
        </p>
      </div>

    <section class="home-projects" aria-label="Project selector">
      <div class="carousel-frame">
        <div class="carousel-heading">
          <p class="section-label">Projects</p>
          <div class="carousel-controls">
            <button class="icon-button" id="prevProject" type="button" aria-label="Previous project">&lsaquo;</button>
            <button class="icon-button" id="nextProject" type="button" aria-label="Next project">&rsaquo;</button>
          </div>
        </div>
        <div class="project-carousel" id="projectCarousel" aria-live="polite"></div>
      </div>
    </section>

    <section class="project-shell" aria-label="Project browser">
      <aside class="project-dock" id="projectDock" aria-label="Floating project selector">
        <button class="project-jump-button" id="projectJumpButton" type="button" aria-label="Open project selector">
          More
        </button>
        <div class="dock-carousel" id="projectDockCarousel" aria-live="polite"></div>

      <article class="project-page" id="projectPage" aria-live="polite"></article>
